<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="540" viewBox="0 0 1200 540" role="img" aria-labelledby="title desc"><title id="title">LogShield — Share the log, not your secrets</title><desc id="desc">Illustration of the original and redacted views, using fictional credentials.</desc><rect width="1200" height="540" rx="20" fill="#f6f8f4"/><path d="M20 0h1160a20 20 0 0 1 20 20v42H0V20A20 20 0 0 1 20 0z" fill="#16251e"/><path d="M37 16l12 4v10c0 6-6 10-12 13-6-3-12-7-12-13V20z" fill="none" stroke="#b2efbd" stroke-width="2"/><text x="63" y="39" font-family="system-ui,sans-serif" font-size="25" font-weight="700" fill="#f6f8f4">LogShield.</text><text x="1020" y="36" font-family="monospace" font-size="12" fill="#b2efbd">LOCAL BY DESIGN</text><text x="40" y="122" font-family="system-ui,sans-serif" font-size="35" font-weight="650" fill="#263e2d">Share the log. <tspan fill="#84957d">Not your secrets.</tspan></text><text x="41" y="155" font-family="system-ui,sans-serif" font-size="16" fill="#7c8d74">Review every detection. Export a separate copy. Nothing to upload.</text><rect x="40" y="190" width="1120" height="267" rx="10" fill="#fff" stroke="#dce5d6"/><path d="M600 190v267" stroke="#dce5d6"/><text x="64" y="225" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#6c7f60">Original · fictional example</text><text x="624" y="225" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#568c52">Redacted copy</text><path d="M40 245h1120" stroke="#e8ede3"/><g font-family="monospace" font-size="16" fill="#52634a"><text x="64" y="286">{</text><text x="84" y="323">"password": "not-a-real-password",</text><text x="84" y="360">"email": "alex@example.com",</text><text x="84" y="397">"status": "ok"</text><text x="64" y="434">}</text><text x="624" y="286">{</text><text x="644" y="323">"password":</text><text x="644" y="360">"email":</text><text x="644" y="397">"status": "ok"</text><text x="624" y="434">}</text></g><rect x="760" y="303" width="264" height="27" rx="4" fill="#f7ead6" stroke="#eddbba"/><rect x="733" y="340" width="237" height="27" rx="4" fill="#f7ead6" stroke="#eddbba"/><g font-family="monospace" font-size="15" fill="#8a683e"><text x="770" y="322">"[REDACTED:PASSWORD]",</text><text x="744" y="359">"[REDACTED:EMAIL]",</text></g><text x="42" y="503" font-family="system-ui,sans-serif" font-size="13" fill="#819374">No dependencies · English / Español · MIT</text><rect x="937" y="476" width="223" height="40" rx="7" fill="#b2efbd"/><text x="978" y="501" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#2c5130">↓ Download copy</text></svg>
